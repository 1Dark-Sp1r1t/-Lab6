<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вікторина</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>

  <header>
    <h1>Вікторина</h1>
    <nav>
      <a href="#current-question">Питання</a>
      <a href="#history">Результати</a>
    </nav>
  </header>
  
  <main>
    <!-- Секція поточного питання -->
  <section id="current-question">
  <div class="progress-container">
    <span class="question-number">Усі питання вікторини</span>
    <div class="progress-bar">
      <div class="progress-fill" style="width: 100%;"></div>
    </div>
  </div>
  
  <h2>Поточні питання</h2>
  
  <!-- Сюди ми будемо динамічно додавати питання через JS -->
  <ul id="questions-list"></ul>
  
  <!-- Елемент підсумку (Крок 9) -->
  <p id="questions-count">Кількість питань: 0</p>
</section>

    <!-- Секція історії спроб -->
    <section id="history">
      <h2>Історія спроб</h2>
      
      <!-- Спільний контейнер для карток (Крок 3) -->
      <div class="cards">
        <article>
          <h3>10.09.2026</h3>
          <p>Результат: 8/10</p>
        </article>
        
        <article>
          <h3>11.09.2026</h3>
          <p>Результат: 10/10</p>
        </article>

        <article>
          <h3>12.09.2026</h3>
          <p>Результат: 9/10</p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>Авторство: [Дяченко Богдан] &copy; 2026</p>
  </footer>

  
</body>
</html>
